# Balanced preset: moderate hazard detection radius and food regrowth.
# Chosen from the world sweep recommendation (radius 16, regrow_rate 0.02).
[world]
width = 50
height = 50
seed = 42

[agent]
energy = 100
move_cost = 1
food_eat = 10
count = 5

[hazard]
damage_per_step = 1
detection_radius = 16

[food]
spawn_rate = 0.1
max_food = 20
regrow_rate = 0.02

[components]
drive = "simple"
retention = "fixed_decay"
policy = "heuristic"
