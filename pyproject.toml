[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simlab"
version = "0.1.0"
description = "Modular 2D survival simulation"
dependencies = [
    "numpy",
    "PySide6",
    "pyqtgraph",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
simlab-cli = "simlab.cli:main"

[tool.setuptools.packages.find]
include = ["simlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
